name: Auto Scrape Rentals

on:
  schedule:
    # Chạy tự động mỗi 2 tiếng
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run rental scraping pipeline
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
          FB_GROUP_URLS: ${{ vars.FB_GROUP_URLS }}
        run: |
          python pipeline.py --once

      - name: Commit & push updated rentals.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rentals.db
          git diff --staged --quiet || (git commit -m "chore(data): auto-update rentals.db [skip ci]" && git push)
